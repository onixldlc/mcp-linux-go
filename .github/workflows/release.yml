name: Build & Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { label: "linux-amd64",   goos: "linux",   goarch: "amd64", out: "mcp-linux-go-linux-amd64" }
          - { label: "linux-arm64",   goos: "linux",   goarch: "arm64", out: "mcp-linux-go-linux-arm64" }
          - { label: "darwin-amd64",  goos: "darwin",  goarch: "amd64", out: "mcp-linux-go-darwin-amd64" }
          - { label: "darwin-arm64",  goos: "darwin",  goarch: "arm64", out: "mcp-linux-go-darwin-arm64" }
          - { label: "windows-amd64", goos: "windows", goarch: "amd64", out: "mcp-linux-go-windows-amd64.exe" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.serverVersion=${{ steps.ver.outputs.version }}" \
            -o dist/${{ matrix.target.out }} .

      - name: Checksum
        run: |
          cd dist
          sha256sum ${{ matrix.target.out }} > ${{ matrix.target.out }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.out }}
          path: |
            dist/${{ matrix.target.out }}
            dist/${{ matrix.target.out }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd artifacts
          cat $(ls *.sha256 | sort) > SHA256SUMS
          rm -f *.sha256
          ls -lah

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
